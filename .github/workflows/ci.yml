name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Editable on purpose: bare `pytest` does not put the working
      # directory on sys.path, so a non-editable install makes the tests
      # import the site-packages copy while --cov measures the source
      # tree, and coverage reports 0%.
      - name: Install the hash-pinned toolchain and this package
        env:
          # Untrusted input (a fork's branch name) passed through the
          # environment, never interpolated into the script.
          REF: ${{ github.head_ref || github.ref_name }}
        run: scripts/ci-install.sh requirements/ci.txt

      - name: Run tests with the 100% coverage gate
        run: pytest tests -q

      # Not a timing gate -- wall-clock is not comparable between
      # runners. This proves the benchmark still runs against the
      # current API rather than rotting into a file that reads as
      # verified and is not.
      - name: Run the benchmark
        run: python benches/bench_diagnostics.py --quick

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the hash-pinned toolchain and this package
        env:
          # Untrusted input (a fork's branch name) passed through the
          # environment, never interpolated into the script.
          REF: ${{ github.head_ref || github.ref_name }}
        run: scripts/ci-install.sh requirements/ci.txt

      - name: Ruff check
        run: ruff check acmt001_lsp/ tests/ benches/ scripts/ examples/ fuzz/

      - name: Black check
        run: black --check acmt001_lsp/ tests/ benches/ scripts/ examples/ fuzz/

      - name: Mypy
        run: mypy acmt001_lsp/

      # Per function: cyclomatic <= 10, cognitive <= 15 (complexipy),
      # Halstead difficulty <= 30, <= 60 lines; <= 500 lines per file.
      # Offenders that predate the gate live in complexity-baseline.json,
      # which may only shrink. tests/ is not measured:
      # test_suite_conformance.py is vendored and checksummed.
      - name: Complexity against the baseline
        run: python scripts/check_complexity.py

  examples:
    name: Examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the hash-pinned toolchain and this package
        env:
          # Untrusted input (a fork's branch name) passed through the
          # environment, never interpolated into the script.
          REF: ${{ github.head_ref || github.ref_name }}
        run: scripts/ci-install.sh requirements/ci.txt

      - name: Run examples
        run: |
          for example in examples/*.py; do
            echo "--- $example ---"
            python "$example"
          done
