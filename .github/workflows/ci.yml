name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core acmt001 + this package
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/sebastienrousseau/acmt001.git"
          pip install .
          pip install pytest

      - name: Run tests
        run: pytest tests -q

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core acmt001 + this package
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/sebastienrousseau/acmt001.git"
          pip install .
          pip install ruff black mypy

      - name: Ruff check
        run: ruff check acmt001_lsp/

      - name: Black check
        run: black --check acmt001_lsp/ tests/

      - name: Mypy
        run: mypy acmt001_lsp/
