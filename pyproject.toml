[tool.poetry]
name = "acmt001-lsp"
version = "0.0.12"
description = "Language Server Protocol (LSP) server for authoring acmt001 ISO 20022 Account Management data files."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/acmt001-lsp"
homepage = "https://acmt001.com"
packages = [
    { include = "acmt001_lsp" },
]

[tool.poetry.scripts]
acmt001-lsp = "acmt001_lsp.server:main"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
# The suite releases in lockstep, core first: the floor is this release.
acmt001 = ">=0.0.12,<1"
# pygls.lsp.server and the publish API the server uses arrived in 2.0.
pygls = ">=2.0,<3"

[tool.poetry.group.dev.dependencies]
# Mirrors requirements/ci.in, the hash-pinned set CI installs.
packaging = ">=23.0"
tomli = { version = ">=2.0", python = "<3.11" }
pytest = ">=9.0.3,<10.0.0"
pytest-cov = ">=6.0.0,<8.0.0"
# CVE-2026-114134 (GHSA-cg8m-r9f2-5wm2) is fixed in black 26.10.1.
black = "^26.10.1"
ruff = ">=0.1,<0.18"
mypy = ">=1.11,<3"
bandit = ">=1.7.0,<2"
radon = ">=6.0.1,<7"
complexipy = { version = ">=8.1,<9", python = "<3.16" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# The vendored conformance test carries a digest of its own bytes,
# so reformatting it would invalidate the check it exists to make.
extend-exclude = "tests/test_suite_conformance\\.py"
line-length = 79
target-version = ['py310']

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# A standalone benchmark has to put the repository on sys.path
# before importing the package it measures, so its imports cannot
# come first.
"benches/*.py" = ["E402"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=acmt001_lsp",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
# server.py uses bare ``dict`` return annotations for its plain-dict payloads;
# allow them rather than editing the vendored server module.
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "acmt001.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
disable_error_code = ["arg-type", "return-value", "attr-defined", "assignment"]

[[tool.mypy.overrides]]
module = "pygls.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lsprotocol.*"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["acmt001_lsp"]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
